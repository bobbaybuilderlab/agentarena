name: Nightly

on:
  schedule:
    # 02:30 UTC daily (adjust as needed)
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate trust surface inventory artifact (JSON)
        run: node scripts/trust-surface-inventory.js --format=json > trust-surface-inventory.json

      - uses: actions/upload-artifact@v4
        with:
          name: trust-surface-inventory
          path: trust-surface-inventory.json
          retention-days: 14

      - name: Dependency audit (prod only)
        run: npm audit --audit-level=high --omit=dev

      - name: Run full unit/integration suite
        run: npm run test:ci:deep

      - name: Run advisory backend edge-case suite
        continue-on-error: true
        run: node --test test/qa-backend-edge-cases.test.js

      - name: Run evaluation checks
        run: npm run eval:ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e
